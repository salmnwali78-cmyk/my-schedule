<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جدولي اليومي</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0 0 0.3rem;
      color: var(--accent);
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .container {
      max-width: 750px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      gap: 1.2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .section-header h2,
    .card h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    input,
    select,
    button {
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border: none;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
      border: none;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
    }

    .list {
      display: grid;
      gap: 0.75rem;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .item-info input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
    }

    .item.done .item-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .badge {
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>جدولي اليومي</h1>
    <p id="current-day-display"></p>
  </header>

  <main class="container">
    <section class="card">
      <h2>إضافة مهمة أو حصة</h2>
      <form id="task-form" class="form-grid">
        <select id="task-day" required>
          <option value="السبت">السبت</option>
          <option value="الأحد">الأحد</option>
          <option value="الاثنين">الاثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
        </select>

        <input type="time" id="task-time" required />
        <input type="text" id="task-title" placeholder="اسم المادة أو المهمة..." required />
        <button type="submit" class="btn-primary">إضافة</button>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>مهام اليوم</h2>
        <select id="day-selector">
          <option value="السبت">السبت</option>
          <option value="الأحد">الأحد</option>
          <option value="الاثنين">الاثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
        </select>
      </div>

      <div id="schedule-list" class="list"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "salman_schedule_items_v1";
    const daysArabic = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    const todayName = daysArabic[new Date().getDay()];

    const dayDisplay = document.getElementById("current-day-display");
    const taskForm = document.getElementById("task-form");
    const taskDay = document.getElementById("task-day");
    const taskTime = document.getElementById("task-time");
    const taskTitle = document.getElementById("task-title");
    const daySelector = document.getElementById("day-selector");
    const scheduleList = document.getElementById("schedule-list");

    dayDisplay.textContent = "اليوم: " + todayName;
    taskDay.value = todayName;
    daySelector.value = todayName;

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderItems() {
      const selectedDay = daySelector.value;
      const items = loadItems()
        .filter((item) => item.day === selectedDay)
        .sort((a, b) => a.time.localeCompare(b.time));

      scheduleList.innerHTML = "";

      if (items.length === 0) {
        scheduleList.innerHTML = '<p class="empty">لا توجد مهام مسجلة لهذا اليوم.</p>';
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item" + (item.done ? " done" : "");

        const info = document.createElement("div");
        info.className = "item-info";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(item.done);
        checkbox.addEventListener("change", () => {
          toggleItem(item.id);
        });

        const timeBadge = document.createElement("span");
        timeBadge.className = "badge";
        timeBadge.textContent = item.time;

        const titleSpan = document.createElement("span");
        titleSpan.className = "item-title";
        titleSpan.textContent = item.title;

        info.appendChild(checkbox);
        info.appendChild(timeBadge);
        info.appendChild(titleSpan);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-danger";
        delBtn.textContent = "حذف";
        delBtn.addEventListener("click", () => {
          deleteItem(item.id);
        });

        row.appendChild(info);
        row.appendChild(delBtn);
        scheduleList.appendChild(row);
      });
    }

    function toggleItem(id) {
      const items = loadItems().map((item) =>
        item.id === id ? { ...item, done: !item.done } : item
      );
      saveItems(items);
      renderItems();
    }

    function deleteItem(id) {
      const items = loadItems().filter((item) => item.id !== id);
      saveItems(items);
      renderItems();
    }

    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = taskTitle.value.trim();
      const time = taskTime.value;
      const day = taskDay.value;

      if (!title || !time) return;

      const items = loadItems();
      items.push({
        id: Date.now().toString(),
        day,
        time,
        title,
        done: false
      });

      saveItems(items);
      daySelector.value = day;
      taskTitle.value = "";
      renderItems();
    });

    daySelector.addEventListener("change", renderItems);

    renderItems();
  </script>
</body>
  </html>
